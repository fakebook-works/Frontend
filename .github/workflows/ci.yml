name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Vite 7 requires Node 20.19+ or 22.12+; 22 is the current LTS line.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reported but not gating yet. ProfilePage.tsx has two pre-existing
      # react-hooks/rules-of-hooks errors that are false positives: useAsProfileImage
      # is an ordinary async event handler, and the rule fires only because its name
      # begins with "use". Renaming it clears both; make this blocking once that is done.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test

      # Type errors surface here rather than at deploy time: build runs tsc -b first.
      - name: Build
        run: npm run build
