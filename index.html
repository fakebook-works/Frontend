<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/fakebook-minimal-cropped.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Fakebook social network frontend for profiles, posts, friend requests, reactions, comments, and sharing."
    />
    <script>
      (() => {
        const storageKey = 'fb.theme'
        let theme = 'light'
        try {
          const saved = localStorage.getItem(storageKey)
          theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
        const themeColor = document.createElement('meta')
        themeColor.name = 'theme-color'
        themeColor.content = theme === 'dark' ? '#242526' : '#ffffff'
        document.head.append(themeColor)
      })()
    </script>
    <title>Fakebook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
